<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Second Brain{% endblock %}</title>
    <!--
        Police Inter via Google Fonts : choix explicite du coéquipier (design
        system), conservé tel quel. Conséquence assumée : le rendu des pages
        dépend de fonts.googleapis.com/fonts.gstatic.com — si ces domaines
        sont injoignables, la police ne charge pas mais la page reste
        lisible et utilisable (repli sur la pile système déclarée dans
        --police, voir app/static/style.css), rien ne casse.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    >
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <header class="entete">
        <a class="marque" href="/">Second Brain</a>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/capture">Capturer</a>
            <a href="/liste">Sources</a>
        </nav>
    </header>
    <main class="contenu">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
