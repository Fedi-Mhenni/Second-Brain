services:
  app:
    build: .
    container_name: Second-brain-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      # Montés pour être vus sans rebuild lors de l'itération locale
      # (ils sont aussi copiés dans l'image, cf. Dockerfile).
      - ./tests:/app/tests
      - ./scripts:/app/scripts