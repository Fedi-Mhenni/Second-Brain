services:
  app:
    build: .
    container_name: Second-brain-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      # Monté pour que les tests édités en local soient vus sans rebuild
      # (pytest et requirements-dev.txt sont, eux, déjà dans l'image).
      - ./tests:/app/tests